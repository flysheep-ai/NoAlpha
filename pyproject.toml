[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noalpha"
version = "0.1.0"
description = "An honesty harness for LLM trading research: point-in-time discipline, leakage self-tests, and forward-only LLM feature collection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "flysheep-ai" }]
keywords = [
    "quantitative-finance", "llm", "trading", "point-in-time",
    "lookahead-bias", "backtesting", "agent", "a-share",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "websockets>=13.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Model training/inference. Imported lazily in noalpha/quant/models.py, so
# the core install stays light for anyone who only wants the research pipeline.
quant = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
]
dev = [
    "pytest>=8.3",
]

[project.urls]
Homepage = "https://github.com/flysheep-ai/NoAlpha"
Issues = "https://github.com/flysheep-ai/NoAlpha/issues"

[project.scripts]
noalpha = "noalpha.cli:main"

[tool.setuptools.packages.find]
include = ["noalpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
